name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      # Smoke test on generated data only; CI never downloads Statcast.
      - run: python -m stuffplus.run_ablation --synthetic --boot 200
